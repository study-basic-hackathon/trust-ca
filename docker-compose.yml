services:
  db:
    # 16-alpineは暫定タグ。実際のCloudSQLインスタンスのPostgresバージョンは
    # 未確認(docs/design/system-architecture.md 9節の未決定事項)。
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trustca
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: 8080
      # `db` はCompose内のサービス名(Dockerのネットワーク越しに解決される)。
      DATABASE_URL: postgresql://postgres:postgres@db:5432/trustca
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # `backend` はCompose内のサービス名。SSR時のfetchはコンテナ内から実行されるため
      # localhostではなくこのホスト名で解決する必要がある。
      BACKEND_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
